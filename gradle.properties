org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,48)
loader_version_range=[47,48)
mapping_channel=official
mapping_version=1.20.1

# Optional integration runtime
mca_version=7.6.26+1.20.1
mca_version_range=[7.6,8)
mcaquests_version_range=[1.6.5,)
townstead_version_range=[0.7.6,0.9)
# Every optional companion range is a lower bound only: Forge enforces an optional range when the mod is
# present, every one of these bridges already fails closed on API drift, and refusing to launch over an
# optional integration is worse than running without it. Townstead's 0.9 bound matches MCA: Quests (0.8
# adds api.v1; 0.9 has not been seen). Recruits is audited for exactly 1.15.2, but that is enforced at
# runtime, not here: RecruitsMixinPlugin applies the Recruits mixins only to 1.15.2, and every adapter
# (RecruitsEvents, RecruitsMilitary, RecruitsObservation) refuses any other version, so a newer Recruits
# launches with the integration off and one warning in the log. ModsTomlRangesTest keeps this rule.
recruits_version_range=[1.15.2,)
mcacrime_version_range=[0.7.5,)
mcareputation_version_range=[0.6.0,)
politics_townstead_version=0.7.6+1.20.1

# Mod metadata
mod_id=ultima_kingdoms
mod_name=Ultima Kingdoms
mod_license=All Rights Reserved
mod_version=0.1.1
mod_group_id=com.ultimakingdoms
mod_authors=Ultima Team
mod_description=Persistent, data-driven kingdoms, settlements, and civic identity for the Ultima modpack.
